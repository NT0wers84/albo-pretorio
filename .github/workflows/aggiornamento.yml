name: Albo Pretorio — Aggiornamento Giornaliero

on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: write

jobs:
  scraper:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa Tesseract e Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita poppler-utils

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze Python
        run: pip install -r requirements.txt

      - name: Esegui scraper
        id: scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          for i in 1 2 3; do
            python scripts/scraper.py && exit 0
            echo "Tentativo $i fallito, riprovo tra 60 secondi..."
            sleep 60
          done
          exit 1

      - name: Mostra nuovi atti trovati
        if: success()
        run: |
          echo "=== NUOVI ATTI TROVATI ==="
          python scripts/mostra_risultati.py

      - name: Pubblica su Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python scripts/publisher_telegram.py

      - name: Pubblica newsletter email
        if: success()
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/publisher_email.py

      - name: Genera sito GitHub Pages
        if: success()
        run: python scripts/genera_sito.py

      - name: Genera feed RSS
        if: success()
        run: python scripts/genera_rss.py

      - name: Salva risultati nel repository
        if: success()
        run: |
          git config user.name "AlboPretorioBot"
          git config user.email "bot@albo-pretorio.local"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Aggiornamento albo: $(date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
